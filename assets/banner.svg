<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Manar El Hynani — a little curiosity, a lot of code.</title><desc id="desc">Animated dark purple banner with twinkling pixel stars, a floating moon, rising cup steam and a blinking cursor. Text remains still. Respects reduced-motion preferences.</desc>
<style>
@keyframes twinkle { 0%,100% {opacity:1} 50% {opacity:.25} }
@keyframes float { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-12px)} }
@keyframes steam { 0% {transform:translateY(4px);opacity:0} 25% {opacity:.8} 100% {transform:translateY(-13px);opacity:0} }
@keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
@keyframes code { 0%,100% {opacity:1} 35% {opacity:.35} 65% {opacity:1} }
.star {animation:twinkle 3.6s ease-in-out infinite}
.star2 {animation-delay:-1.2s}
.star3 {animation-delay:-2.4s}
.moon {animation:float 5s ease-in-out infinite}
.steam {animation:steam 2.8s linear infinite}
.steam2 {animation-delay:-1.4s}
.cursor {animation:blink 1.2s steps(1,end) infinite}
.code {animation:code 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce) {
.star,.moon,.steam,.cursor,.code {animation:none}
}

@keyframes typing { 0%,6% {width:0} 38%,90% {width:610px} 100% {width:0} }
@keyframes shoot { 0%,65% {opacity:0;transform:translate(0,0)} 67% {opacity:1} 82% {opacity:0;transform:translate(145px,70px)} 100% {opacity:0;transform:translate(145px,70px)} }
@keyframes drawCode { 0%,10% {width:0} 48%,90% {width:70px} 100% {width:0} }
@keyframes lamp { 0%,100% {opacity:.1} 50% {opacity:.5} }
.typing-window {animation:typing 9s steps(20,end) infinite}
.shooting-star {animation:shoot 7s linear infinite}
.code-line {animation:drawCode 5s steps(8,end) infinite}
.line2 {animation-delay:-1.6s}
.line3 {animation-delay:-3.2s}
.monitor-light {animation:lamp 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce) {
.typing-window,.shooting-star,.code-line,.monitor-light {animation:none}
.shooting-star {opacity:0}
}
</style>
<defs><clipPath id="typing"><rect class="typing-window" x="50" y="104" width="610" height="60" /></clipPath><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#21172F"/><stop offset="1" stop-color="#151020"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="2" height="2" fill="#B39BCB" opacity=".1"/></pattern></defs>
<rect x="1" y="1" width="1198" height="418" rx="20" fill="url(#bg)" stroke="#493450" stroke-width="2"/>
<rect x="18" y="18" width="1164" height="384" rx="12" fill="url(#dots)"/>
<g fill="#F2B5CF"><path class="star" d="M64 47h6v6h6v6h-6v6h-6v-6h-6v-6h6z"/><path class="star star2" d="M1100 61h5v5h5v5h-5v5h-5v-5h-5v-5h5z"/><path class="star star3" d="M778 139h4v4h4v4h-4v4h-4v-4h-4v-4h4z"/></g>
<text x="90" y="62" font-family="monospace" font-size="14" letter-spacing="3" fill="#BCA7CF">MANAR'S LITTLE CORNER OF THE INTERNET</text>
<text clip-path="url(#typing)" x="57" y="149" font-family="monospace" font-size="51" font-weight="bold" fill="#F7EAF3">Hi, I'm Manar<tspan fill="#EEADD0">.</tspan></text>
<text x="60" y="194" font-family="monospace" font-size="20" fill="#EEADD0">a little curiosity, a lot of code.</text>
<text x="60" y="247" font-family="monospace" font-size="16" fill="#C2B2D0">Building things for the web.</text>
<text x="60" y="275" font-family="monospace" font-size="16" fill="#C2B2D0">Finding my way into security &amp; cloud.</text>
<rect x="60" y="322" width="123" height="34" rx="6" fill="#382440"/><text x="121" y="344" text-anchor="middle" font-family="monospace" font-size="13" fill="#F0B6D0">ENSA student</text>
<rect x="196" y="322" width="121" height="34" rx="6" fill="#30233E"/><text x="256" y="344" text-anchor="middle" font-family="monospace" font-size="13" fill="#D0BAEE">Web dev</text>
<rect x="330" y="322" width="102" height="34" rx="6" fill="#30233E"/><text x="381" y="344" text-anchor="middle" font-family="monospace" font-size="13" fill="#D0BAEE">Morocco</text>
<g class="shooting-star" opacity="0" fill="#F2B5CF"><rect x="705" y="76" width="6" height="6"/><rect x="693" y="70" width="10" height="4" opacity=".6"/><rect x="680" y="64" width="10" height="4" opacity=".3"/></g>
<!-- Pixel illustration: an evening coding desk. -->
<g shape-rendering="crispEdges">
<path class="moon" d="M964 78h40v8h-16v8h-8v24h8v8h16v8h-40v-8h-8V86h8z" fill="#D1B1EC"/>
<rect x="842" y="146" width="242" height="154" fill="#4B365E"/><rect x="850" y="138" width="226" height="8" fill="#4B365E"/>
<rect x="850" y="146" width="226" height="138" fill="#100D1A"/><rect class="monitor-light" x="854" y="172" width="218" height="108" fill="none" stroke="#C5A3EB" stroke-width="2" opacity=".1"/><rect x="850" y="146" width="226" height="22" fill="#33243F"/>
<rect x="860" y="154" width="6" height="6" fill="#F1B2D0"/><rect x="872" y="154" width="6" height="6" fill="#B89BDC"/><rect x="884" y="154" width="6" height="6" fill="#78678F"/>
<g fill="#D5B2EE"><rect x="870" y="191" width="36" height="6"/><rect x="880" y="207" width="54" height="6"/><rect x="880" y="223" width="30" height="6"/><rect x="870" y="255" width="20" height="6"/></g>
<g class="code" fill="#EFACCA"><rect x="915" y="191" width="40" height="6"/><rect class="code-line" x="942" y="207" width="70" height="6"/><rect class="code-line line2" x="920" y="223" width="56" height="6"/><rect class="code-line line3" x="880" y="239" width="62" height="6"/></g>
<rect class="cursor" x="1018" y="253" width="8" height="12" fill="#F1B2D0"/>
<rect x="950" y="300" width="24" height="21" fill="#624873"/><rect x="921" y="321" width="82" height="8" fill="#8D6DA3"/>
<rect x="800" y="337" width="333" height="10" fill="#B68BA8"/><rect x="813" y="347" width="10" height="35" fill="#62445F"/><rect x="1108" y="347" width="10" height="35" fill="#62445F"/>
<rect x="1097" y="304" width="25" height="25" fill="#E7ACC8"/><path d="M1122 308h10v16h-10v-5h5v-6h-5z" fill="#E7ACC8"/>
<rect class="steam" x="1103" y="285" width="4" height="11" fill="#82668F"/><rect class="steam steam2" x="1113" y="275" width="4" height="15" fill="#82668F"/>
<rect x="801" y="313" width="28" height="16" fill="#A98BBC"/><rect x="811" y="286" width="6" height="27" fill="#9CA990"/><rect x="799" y="289" width="12" height="8" fill="#9CA990"/><rect x="817" y="279" width="12" height="8" fill="#9CA990"/>
<rect class="star" x="1053" y="90" width="4" height="4" fill="#EFACCA"/><rect class="star star2" x="815" y="93" width="4" height="4" fill="#C7A9E3"/><rect class="star star3" x="1126" y="213" width="4" height="4" fill="#C7A9E3"/>
</g></svg>
